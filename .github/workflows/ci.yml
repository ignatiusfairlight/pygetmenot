name: CI

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: stable
            - run: go vet ./...
            - uses: golangci/golangci-lint-action@v9
              with:
                version: latest
            - run: go test ./...
            - run: go build .